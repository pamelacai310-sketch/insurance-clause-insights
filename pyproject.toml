[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-clause-insights"
version = "0.1.0"
description = "Compare insurance contract clauses across 20+ peer products by reusing insurance-crawler-push."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
  "selenium>=4.20.0",
  "webdriver-manager>=4.0.1",
  "pdfplumber>=0.11.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.2",
]

[project.scripts]
insurance-clause-insights = "insurance_clause_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
